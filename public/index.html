<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Affordability Cases</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2933;
        background: #f6f7f9;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 18px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 28px;
        font-weight: 700;
      }

      button {
        border: 0;
        background: transparent;
        font: inherit;
        color: inherit;
      }

      .back {
        margin-bottom: 18px;
        color: #2563eb;
        cursor: pointer;
        font-weight: 600;
      }

      .run-button {
        background: #1f2933;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 12px;
        white-space: nowrap;
      }

      .input-link {
        color: #2563eb;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
      }

      .evidence-link {
        align-items: center;
        color: #2563eb;
        display: inline-flex;
        height: 32px;
        justify-content: center;
        width: 32px;
      }

      .evidence-link svg {
        height: 20px;
        width: 20px;
      }

      .run-button:disabled {
        background: #9aa5b1;
        cursor: wait;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border: 1px solid #d8dee6;
      }

      th,
      td {
        padding: 13px 14px;
        border-bottom: 1px solid #e5e9ef;
        text-align: left;
        font-size: 14px;
      }

      th {
        background: #eef2f6;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #52606d;
      }

      tr.case-row {
        cursor: pointer;
      }

      tr.case-row:hover {
        background: #f8fafc;
      }

      .amount {
        font-weight: 700;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 700;
      }

      .status::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9aa5b1;
      }

      .status.success::before {
        background: #14804a;
      }

      .status.success-warning::before {
        background: #facc15;
      }

      .status.failed::before,
      .status.timed_out::before {
        background: #c2410c;
      }

      .status.not_run::before,
      .status.queued::before,
      .status.running::before {
        background: #facc15;
      }

      .muted {
        color: #697586;
      }

      .summary {
        margin: -8px 0 20px;
        color: #52606d;
        line-height: 1.6;
      }

      .empty {
        padding: 28px;
        background: #ffffff;
        border: 1px solid #d8dee6;
        color: #697586;
      }

      .modal {
        align-items: center;
        background: rgba(15, 23, 42, 0.5);
        display: flex;
        inset: 0;
        justify-content: center;
        padding: 20px;
        position: fixed;
        z-index: 10;
      }

      .modal-panel {
        background: #ffffff;
        border-radius: 6px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.24);
        display: flex;
        flex-direction: column;
        max-height: 84vh;
        max-width: 860px;
        overflow: hidden;
        width: 100%;
      }

      .modal-header {
        flex: 0 0 auto;
        align-items: center;
        border-bottom: 1px solid #e5e9ef;
        display: flex;
        justify-content: space-between;
        padding: 14px 18px;
      }

      .modal-header h2 {
        font-size: 18px;
        margin: 0;
      }

      .close-button {
        color: #52606d;
        cursor: pointer;
        font-size: 22px;
        line-height: 1;
      }

      .input-json {
        background: #0f172a;
        color: #e5e7eb;
        font-size: 12px;
        line-height: 1.5;
        margin: 0;
        min-height: 0;
        overflow: auto;
        padding: 18px 18px 28px;
        white-space: pre-wrap;
      }

      @media (max-width: 720px) {
        main {
          padding: 22px 12px;
        }

        th:nth-child(3),
        td:nth-child(3),
        th:nth-child(4),
        td:nth-child(4) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <script>
      const app = document.querySelector("#app");
      const money = new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: "GBP",
        maximumFractionDigits: 0
      });
      const activeRunsKey = "affordabilityActiveRuns";
      let pollTimer = null;
      let currentCaseTableKey = null;
      let currentCaseTableDetails = null;
      let currentCaseTableLenders = [];

      window.addEventListener("hashchange", render);
      render();

      async function render() {
        if (pollTimer) {
          clearTimeout(pollTimer);
          pollTimer = null;
        }

        const params = parseHash();
        if (params.run) {
          await renderRun(params.run);
        } else if (params.case) {
          await renderCase(params.case);
        } else {
          await renderCases();
        }
      }

      function parseHash() {
        const hash = location.hash.replace(/^#/, "");
        if (!hash) return {};
        if (hash.startsWith("case=")) {
          return { case: decodeURIComponent(hash.slice("case=".length)) };
        }
        if (hash.startsWith("run=")) {
          return { run: decodeURIComponent(hash.slice("run=".length)) };
        }

        return {};
      }

      async function renderCases() {
        currentCaseTableKey = null;
        currentCaseTableDetails = null;
        currentCaseTableLenders = [];
        app.innerHTML = "<h1>Cases</h1><div class='empty'>Loading cases...</div>";
        const { cases } = await fetchJson("/api/cases");
        const activeRuns = await loadActiveRuns();

        if (!cases.length) {
          app.innerHTML = "<h1>Cases</h1><div class='empty'>No cases found.</div>";
          return;
        }

        app.innerHTML = `
          <h1>Cases</h1>
          <table class="table">
            <thead>
              <tr>
                <th>Case</th>
                <th>Purpose</th>
                <th>Loan</th>
                <th>Value</th>
                <th>Lenders</th>
                <th>Raw input</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${cases
                .map(
                  (item) => `
                    <tr class="case-row" data-id="${escapeHtml(item.id)}">
                      <td><strong>${escapeHtml(item.title)}</strong></td>
                      <td>${escapeHtml(item.mortgagePurpose)}</td>
                      <td>${money.format(item.loanAmount)}</td>
                      <td>${money.format(item.propertyValue)}</td>
                      <td>${item.lendersRun}</td>
                      <td><button class="input-link" data-input-id="${escapeHtml(item.id)}">View raw</button></td>
                      <td>${formatCaseAction(item, activeRuns[item.id])}</td>
                    </tr>
                  `
                )
                .join("")}
            </tbody>
          </table>
        `;

        app.querySelectorAll(".case-row").forEach((row) => {
          row.addEventListener("click", () => {
            location.hash = `case=${encodeURIComponent(row.dataset.id)}`;
          });
        });

        app.querySelectorAll(".run-button").forEach((button) => {
          button.addEventListener("click", async (event) => {
            event.stopPropagation();
            await runAffordability(button);
          });
        });

        app.querySelectorAll("[data-open-run-id]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            location.hash = `run=${encodeURIComponent(button.dataset.openRunId)}`;
          });
        });

        app.querySelectorAll(".input-link").forEach((button) => {
          button.addEventListener("click", async (event) => {
            event.stopPropagation();
            await showInput(button.dataset.inputId);
          });
        });
      }

      async function runAffordability(button) {
        const caseId = button.dataset.runId;
        button.disabled = true;
        button.textContent = "Running...";

        try {
          const run = await fetchJson(`/api/cases/${encodeURIComponent(caseId)}/run-affordability`, {
            method: "POST"
          });
          if (run.runId) {
            saveActiveRun(caseId, run.runId);
            location.hash = `run=${encodeURIComponent(run.runId)}`;
          } else {
            location.hash = `case=${encodeURIComponent(caseId)}`;
          }
        } catch (error) {
          button.textContent = "Run failed";
          button.disabled = false;
          console.error(error);
        }
      }

      async function renderRun(runId) {
        const tableKey = `run:${runId}`;
        if (currentCaseTableKey !== tableKey) {
          app.innerHTML = "<button class='back'>Back to cases</button><div class='empty'>Loading run...</div>";
        }

        const run = await fetchJson(`/api/runs/${encodeURIComponent(runId)}`);
        const details = await fetchJson(`/api/cases/${encodeURIComponent(run.caseId)}`);

        saveActiveRun(run.caseId, run.runId);
        if (currentCaseTableKey === tableKey) {
          updateCaseTable(details, run.results, run);
        } else {
          renderCaseTable(details, run.results, run, tableKey);
        }

        if (!isTerminalRun(run.status)) {
          pollTimer = setTimeout(() => {
            if (location.hash === `#run=${encodeURIComponent(runId)}`) {
              void renderRun(runId);
            }
          }, 3000);
        } else {
          clearActiveRun(run.caseId, run.runId);
        }
      }

      async function renderCase(caseId) {
        const tableKey = `case:${caseId}`;
        if (currentCaseTableKey !== tableKey) {
          app.innerHTML = "<button class='back'>Back to cases</button><div class='empty'>Loading case...</div>";
        }

        const details = await fetchJson(`/api/cases/${encodeURIComponent(caseId)}`);
        if (currentCaseTableKey === tableKey) {
          updateCaseTable(details, details.lenders, details.latestRun ?? null);
        } else {
          renderCaseTable(details, details.lenders, details.latestRun ?? null, tableKey);
        }

        if (details.latestRun && !isTerminalRun(details.latestRun.status)) {
          saveActiveRun(caseId, details.latestRun.runId);
          pollTimer = setTimeout(() => {
            if (location.hash === `#case=${encodeURIComponent(caseId)}`) {
              void renderCase(caseId);
            }
          }, 3000);
        } else if (details.latestRun) {
          clearActiveRun(caseId, details.latestRun.runId);
        }
      }

      function renderCaseTable(details, lenders, run = null, tableKey = null) {
        currentCaseTableKey = tableKey;
        currentCaseTableDetails = details;
        currentCaseTableLenders = lenders;

        app.innerHTML = `
          <button class="back">Back to cases</button>
          <h1>${escapeHtml(details.title)}</h1>
          <div class="summary">
            ${escapeHtml(details.summary.mortgagePurpose)} /
            ${escapeHtml(details.summary.applicationType)} /
            ${escapeHtml(details.summary.repaymentType)} /
            ${details.summary.termYears} years
            ${run ? `<br><span data-run-progress>${escapeHtml(formatRunProgress(run))}</span>` : ""}
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>Lender</th>
                <th>Status</th>
                <th>Affordability</th>
                <th>Message</th>
                <th>Output</th>
                <th>Evidence</th>
              </tr>
            </thead>
            <tbody>
              ${lenders
                .map(
                  (run) => `
                    <tr data-lender-row="${escapeHtml(run.lender)}">
                      <td><strong>${formatLender(run.lender)}</strong></td>
                      <td data-lender-status="${escapeHtml(run.lender)}">${statusHtml(run, details)}</td>
                      <td class="amount" data-lender-affordability="${escapeHtml(run.lender)}">${formatAffordability(run)}</td>
                      <td class="muted" data-lender-message="${escapeHtml(run.lender)}">${escapeHtml(formatMessage(run))}</td>
                      <td data-lender-output="${escapeHtml(run.lender)}">${formatOutput(run)}</td>
                      <td data-lender-evidence="${escapeHtml(run.lender)}">${formatEvidence(run)}</td>
                    </tr>
                  `
                )
                .join("")}
            </tbody>
          </table>
        `;

        app.querySelector(".back").addEventListener("click", () => {
          location.hash = "";
        });

        app.querySelectorAll("[data-output-lender]").forEach((button) => {
          button.dataset.boundOutputClick = "true";
          button.addEventListener("click", () => {
            const run = currentCaseTableLenders.find((candidate) => candidate.lender === button.dataset.outputLender);
            if (run?.output) {
              showJson(`Mapped output: ${formatLender(run.lender)}`, run.output);
            }
          });
        });
      }

      function updateCaseTable(details, lenders, run = null) {
        currentCaseTableDetails = details;
        currentCaseTableLenders = lenders;

        const progress = app.querySelector("[data-run-progress]");
        if (!progress && run) {
          renderCaseTable(details, lenders, run, currentCaseTableKey);
          return;
        }

        if (progress && run) {
          progress.textContent = formatRunProgress(run);
        }

        for (const lenderRun of lenders) {
          const lender = cssEscape(lenderRun.lender);
          const row = app.querySelector(`[data-lender-row="${lender}"]`);
          if (!row) {
            renderCaseTable(details, lenders, run, currentCaseTableKey);
            return;
          }

          setHtml(`[data-lender-status="${lender}"]`, statusHtml(lenderRun, details));
          setText(`[data-lender-affordability="${lender}"]`, formatAffordability(lenderRun));
          setText(`[data-lender-message="${lender}"]`, formatMessage(lenderRun));
          setHtml(`[data-lender-output="${lender}"]`, formatOutput(lenderRun));
          setHtml(`[data-lender-evidence="${lender}"]`, formatEvidence(lenderRun));
        }

        app.querySelectorAll("[data-output-lender]").forEach((button) => {
          if (button.dataset.boundOutputClick === "true") return;
          button.dataset.boundOutputClick = "true";
          button.addEventListener("click", () => {
            const run = currentCaseTableLenders.find((candidate) => candidate.lender === button.dataset.outputLender);
            if (run?.output) {
              showJson(`Mapped output: ${formatLender(run.lender)}`, run.output);
            }
          });
        });
      }

      function setText(selector, value) {
        const element = app.querySelector(selector);
        if (element && element.textContent !== value) {
          element.textContent = value;
        }
      }

      function setHtml(selector, value) {
        const element = app.querySelector(selector);
        if (element && element.innerHTML !== value) {
          element.innerHTML = value;
        }
      }

      async function fetchJson(url, options = undefined) {
        const response = await fetch(url, options);
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }

        return response.json();
      }

      async function loadActiveRuns() {
        const stored = readActiveRuns();
        const entries = await Promise.all(
          Object.entries(stored).map(async ([caseId, runId]) => {
            try {
              const run = await fetchJson(`/api/runs/${encodeURIComponent(runId)}`);
              if (isTerminalRun(run.status)) {
                clearActiveRun(caseId, runId);
                return null;
              }
              return [caseId, runId];
            } catch {
              clearActiveRun(caseId, runId);
              return null;
            }
          })
        );

        return Object.fromEntries(entries.filter(Boolean));
      }

      function readActiveRuns() {
        try {
          const parsed = JSON.parse(localStorage.getItem(activeRunsKey) ?? "{}");
          return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
        } catch {
          return {};
        }
      }

      function saveActiveRun(caseId, runId) {
        localStorage.setItem(activeRunsKey, JSON.stringify({
          ...readActiveRuns(),
          [caseId]: runId
        }));
      }

      function clearActiveRun(caseId, runId) {
        const stored = readActiveRuns();
        if (stored[caseId] !== runId) return;
        delete stored[caseId];
        localStorage.setItem(activeRunsKey, JSON.stringify(stored));
      }

      async function showInput(caseId) {
        const input = await fetchJson(`/api/cases/${encodeURIComponent(caseId)}/input`);
        const modal = document.createElement("div");
        modal.className = "modal";
        modal.innerHTML = `
          <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Case input">
            <div class="modal-header">
              <h2>Raw ${escapeHtml(input.format.toUpperCase())}: ${escapeHtml(input.fileName)}</h2>
              <button class="close-button" aria-label="Close">&times;</button>
            </div>
            <pre class="input-json">${escapeHtml(input.content)}</pre>
          </div>
        `;

        document.body.append(modal);
        const close = () => modal.remove();
        modal.querySelector(".close-button").addEventListener("click", close);
        modal.addEventListener("click", (event) => {
          if (event.target === modal) close();
        });
      }

      function showJson(title, value) {
        const modal = document.createElement("div");
        modal.className = "modal";
        modal.innerHTML = `
          <div class="modal-panel" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
            <div class="modal-header">
              <h2>${escapeHtml(title)}</h2>
              <button class="close-button" aria-label="Close">&times;</button>
            </div>
            <pre class="input-json">${escapeHtml(JSON.stringify(value, null, 2))}</pre>
          </div>
        `;

        document.body.append(modal);
        const close = () => modal.remove();
        modal.querySelector(".close-button").addEventListener("click", close);
        modal.addEventListener("click", (event) => {
          if (event.target === modal) close();
        });
      }

      function formatLender(value) {
        return value.replace(/_/g, " ").replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      function formatStatus(value) {
        if (value === "success") return "Success";
        if (value === "failed") return "Failed";
        if (value === "queued") return "Queued";
        if (value === "running") return "Running";
        if (value === "timed_out") return "Timed out";
        return "Not run";
      }

      function statusHtml(run, details) {
        return `<span class="status ${statusClass(run, details)}">${formatStatus(run.status)}</span>`;
      }

      function statusClass(run, details) {
        if (run.status !== "success") return run.status;
        const loanAmount = Number(details.summary.loanAmount);
        const affordabilityAmount = Number(run.affordabilityAmount);
        return Number.isFinite(loanAmount) &&
          Number.isFinite(affordabilityAmount) &&
          affordabilityAmount < loanAmount
            ? "success-warning"
            : "success";
      }

      function formatCaseAction(item, activeRunId) {
        if (activeRunId) {
          return `<button class="run-button" data-open-run-id="${escapeHtml(activeRunId)}">View active run</button>`;
        }

        return `<button class="run-button" data-run-id="${escapeHtml(item.id)}">Run affordability</button>`;
      }

      function formatAffordability(run) {
        if (["not_run", "queued", "running", "timed_out"].includes(run.status)) return "-";
        if (run.affordabilityAmount == null) return "Failed";
        return money.format(run.affordabilityAmount);
      }

      function formatOutput(run) {
        return run.output == null
          ? "-"
          : `<button class="input-link" data-output-lender="${escapeHtml(run.lender)}">View JSON</button>`;
      }

      function formatMessage(run) {
        if (run.status === "success") return "Congratulations, affordability result returned successfully.";
        return run.message;
      }

      function formatRunProgress(run) {
        return `Run ${run.status}: ${run.completedCount}/${run.totalLenders} lenders completed`;
      }

      function isTerminalRun(status) {
        return ["completed", "completed_with_failures", "failed", "timed_out"].includes(status);
      }

      function formatEvidence(run) {
        if (!run.evidenceUrl) return "-";
        const label = run.evidenceType === "pdf" ? "Open PDF evidence" : "Open image evidence";
        return `
          <a class="evidence-link" href="${escapeHtml(run.evidenceUrl)}" target="_blank" rel="noopener" aria-label="${label}" title="${label}">
            ${run.evidenceType === "pdf" ? pdfIcon() : imageIcon()}
          </a>
        `;
      }

      function pdfIcon() {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
            <path d="M8 13h1.5a1.5 1.5 0 0 1 0 3H8v-3z"></path>
            <path d="M13 13v3"></path>
            <path d="M13 13h2"></path>
            <path d="M13 14.5h1.5"></path>
          </svg>
        `;
      }

      function imageIcon() {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="9" cy="9" r="2"></circle>
            <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path>
          </svg>
        `;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function cssEscape(value) {
        if (window.CSS && typeof window.CSS.escape === "function") {
          return window.CSS.escape(value);
        }

        return String(value).replace(/["\\]/g, "\\$&");
      }
    </script>
  </body>
</html>
